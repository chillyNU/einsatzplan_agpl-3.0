# ─────────────────────────────────────────────────────────────────────────────
# Einsatzplan – Schutz sensibler Dateien für Nginx / LiteSpeed
#
# Diese Regeln in den passenden server { ... }-Block der Website übernehmen.
# Sie sperren den direkten HTTP-Zugriff auf die Datenbank und interne
# PHP-Includes. Die Anwendung selbst liest diese Dateien weiterhin ganz
# normal vom Dateisystem – nur der Abruf über den Browser wird verweigert.
#
# Hinweis: Unter Apache übernehmen die mitgelieferten .htaccess-Dateien
# (im Hauptordner sowie in data/) denselben Schutz automatisch.
# ─────────────────────────────────────────────────────────────────────────────

location ^~ /data/     { deny all; return 404; }

location = /config.php     { deny all; return 404; }
location = /db_helpers.php { deny all; return 404; }
location = /init_db.php    { deny all; return 404; }
